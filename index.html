<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tuner</title>
    <meta name="description" content="A chromatic guitar tuner that listens through the microphone." />
    <meta name="theme-color" content="#0e0f11" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tuner" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="device" data-power="off" data-panel="closed">
      <header class="brand">
        <span class="wordmark">tuner</span>
        <span class="label">tn-6 chromatic</span>
      </header>

      <div class="reading" aria-label="Turn the tuner on">
        <canvas class="bloom" aria-hidden="true"></canvas>
        <canvas class="lights" aria-hidden="true"></canvas>
        <div class="message">
          <p class="message-title"></p>
          <p class="message-detail"></p>
        </div>
      </div>

      <section class="panel">
        <div class="dashboard" id="dashboard" inert>
          <div class="dials">
            <div class="dial-group">
              <div class="dial" data-dial="brightness" role="slider" tabindex="0" aria-label="Display brightness" aria-valuemin="0" aria-valuemax="100">
                <svg class="dial-scale" viewBox="-64 -64 128 128" aria-hidden="true"></svg>
                <span class="knob"><span class="pointer"><span></span></span></span>
              </div>
              <span class="label">brightness</span>
            </div>
            <div class="dial-group">
              <div class="dial" data-dial="glow" role="slider" tabindex="0" aria-label="Glow strength" aria-valuemin="0" aria-valuemax="100">
                <svg class="dial-scale" viewBox="-64 -64 128 128" aria-hidden="true"></svg>
                <span class="knob"><span class="pointer"><span></span></span></span>
              </div>
              <span class="label">glow</span>
            </div>
          </div>
        </div>

        <div class="keys">
          <div class="key-group">
            <span class="label">power</span>
            <span class="well">
              <button class="key key-power" type="button" aria-label="Power" aria-pressed="false"><i class="pilot"></i></button>
            </span>
          </div>
          <div class="key-group">
            <span class="label">controls</span>
            <span class="well">
              <button class="key key-controls" type="button" aria-label="Controls" aria-pressed="false" aria-controls="dashboard"></button>
            </span>
          </div>
          <div class="key-group mic">
            <span class="label">mic</span>
            <canvas class="grille" aria-hidden="true"></canvas>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
