<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tuner</title>
    <meta name="description" content="A chromatic guitar tuner that listens through the microphone." />
    <meta name="theme-color" content="#1b1c1f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tuner" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="device" data-power="off" data-panel="closed">
      <header class="brand">
        <span class="wordmark">tuner</span>
        <span class="label">tn-6 chromatic</span>
      </header>

      <!-- The screen is a lid: it lifts to uncover the controls tray beneath it. -->
      <div class="stage">
        <section class="dashboard" id="dashboard" aria-label="Controls" inert>
          <div class="dashboard-head">
            <h2 class="dashboard-title label">controls</h2>
            <span class="well tabs" role="tablist" aria-label="Control pages">
              <button class="key key-tab" type="button" role="tab" aria-selected="true" data-page-key="display"><span class="legend">display</span></button>
              <button class="key key-tab" type="button" role="tab" aria-selected="false" data-page-key="tuning"><span class="legend">tuning</span></button>
            </span>
          </div>
          <div class="pages">
          <div class="page" data-page="display" role="tabpanel" aria-label="Display">
            <div class="cell cell-dial">
              <div class="dial" data-dial="contrast" role="slider" tabindex="0" aria-label="Contrast" aria-valuemin="0" aria-valuemax="100">
                <svg class="dial-scale" viewBox="-64 -64 128 128" aria-hidden="true"></svg>
                <span class="knob"><span class="pointer"><span></span></span></span>
              </div>
              <span class="label">contrast</span>
            </div>
            <div class="cell">
              <span class="label">colors</span>
              <span class="well bank" role="radiogroup" aria-label="Colors" data-setting="colors">
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="green-red" aria-label="Green and red"><span class="swatches"><i></i><i></i></span></button>
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="teal-magenta" aria-label="Teal and magenta"><span class="swatches"><i></i><i></i></span></button>
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="blue-orange" aria-label="Blue and orange"><span class="swatches"><i></i><i></i></span></button>
              </span>
            </div>
            <div class="cell">
              <span class="label">theme</span>
              <span class="well bank" role="radiogroup" aria-label="Theme" data-setting="theme">
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="dark"><span class="legend">dark</span></button>
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="light"><span class="legend">light</span></button>
              </span>
            </div>
            <div class="cell">
              <span class="label"><i class="glow-led"></i>glow</span>
              <span class="well bank" role="radiogroup" aria-label="Glow" data-setting="glow">
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="off"><span class="legend">off</span></button>
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="low"><span class="legend">low</span></button>
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="hi"><span class="legend">hi</span></button>
              </span>
            </div>
            <div class="cell">
              <span class="label">gradient</span>
              <span class="well bank" role="radiogroup" aria-label="Gradient" data-setting="gradient">
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="on"><span class="legend">on</span></button>
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="off"><span class="legend">off</span></button>
              </span>
            </div>
          </div>
          <div class="page" data-page="tuning" role="tabpanel" aria-label="Tuning">
            <div class="cell cell-dial">
              <div class="dial" data-dial="sensitivity" role="slider" tabindex="0" aria-label="Mic sensitivity" aria-valuemin="0" aria-valuemax="100">
                <svg class="dial-scale" viewBox="-64 -64 128 128" aria-hidden="true"></svg>
                <span class="knob"><span class="pointer"><span></span></span></span>
              </div>
              <span class="label">mic sensitivity</span>
            </div>
            <div class="cell">
              <span class="label">tolerance</span>
              <span class="well bank" role="radiogroup" aria-label="Tolerance" data-setting="tolerance">
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="tight"><span class="legend">tight</span></button>
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="mid"><span class="legend">mid</span></button>
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="loose"><span class="legend">loose</span></button>
              </span>
            </div>
            <div class="cell">
              <span class="label">response</span>
              <span class="well bank" role="radiogroup" aria-label="Response" data-setting="response">
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="calm"><span class="legend">calm</span></button>
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="mid"><span class="legend">mid</span></button>
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="quick"><span class="legend">quick</span></button>
              </span>
            </div>
            <div class="cell">
              <span class="label">settle</span>
              <span class="well bank" role="radiogroup" aria-label="Settle" data-setting="settle">
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="short"><span class="legend">short</span></button>
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="mid"><span class="legend">mid</span></button>
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="long"><span class="legend">long</span></button>
              </span>
            </div>
            <div class="cell">
              <span class="label">auto-off</span>
              <span class="well bank" role="radiogroup" aria-label="Auto-off" data-setting="autoOff">
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="off"><span class="legend">off</span></button>
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="2"><span class="legend">2m</span></button>
                <button class="key key-mini" type="button" role="radio" aria-checked="false" data-value="5"><span class="legend">5m</span></button>
              </span>
            </div>
          </div>
          </div>
        </section>

        <div class="reading" aria-label="Turn the tuner on">
          <div class="confirm" aria-hidden="true"></div>
          <div class="screen-content">
            <canvas class="bloom" aria-hidden="true"></canvas>
            <canvas class="lights" aria-hidden="true"></canvas>
            <div class="message">
              <svg class="message-icon" aria-hidden="true"></svg>
              <p class="message-title"></p>
              <p class="message-detail"></p>
            </div>
          </div>
        </div>
      </div>

      <section class="panel">
        <div class="keys">
          <div class="mic">
            <span class="label">mic</span>
            <canvas class="grille" aria-hidden="true"></canvas>
          </div>
          <span class="well">
            <button class="key key-controls" type="button" aria-pressed="false" aria-controls="dashboard">
              <span class="legend">controls</span>
            </button>
          </span>
          <span class="well well-power">
            <button class="key key-power" type="button" aria-pressed="false">
              <span class="legend"><i class="pilot"></i>power</span>
            </button>
          </span>
        </div>
      </section>
    </main>
  </body>
</html>
