<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tuner</title>
    <meta name="description" content="A chromatic guitar tuner that listens through the microphone." />
    <meta name="theme-color" content="#1b1c1f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tuner" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="device" data-power="off" data-panel="closed">
      <header class="brand">
        <span class="wordmark">tuner</span>
        <span class="label">tn-6 chromatic</span>
      </header>

      <!-- The screen is a lid: it lifts to uncover the controls tray beneath it. -->
      <div class="stage">
        <section class="dashboard" id="dashboard" aria-label="Controls" inert>
          <h2 class="dashboard-title label">controls</h2>
          <div class="settings">
            <div class="setting">
              <div class="dial" data-dial="brightness" role="slider" tabindex="0" aria-label="Brightness" aria-valuemin="0" aria-valuemax="100">
                <svg class="dial-scale" viewBox="-64 -64 128 128" aria-hidden="true"></svg>
                <span class="knob"><span class="pointer"><span></span></span></span>
              </div>
              <span class="label">brightness</span>
            </div>
            <div class="setting">
              <span class="well bank" role="radiogroup" aria-label="Glow">
                <button class="key key-small" type="button" role="radio" aria-checked="false" data-glow="off"><span class="legend">off</span></button>
                <button class="key key-small" type="button" role="radio" aria-checked="false" data-glow="low"><span class="legend">low</span></button>
                <button class="key key-small" type="button" role="radio" aria-checked="false" data-glow="hi"><span class="legend">hi</span></button>
              </span>
              <span class="label"><i class="glow-led"></i>glow</span>
            </div>
          </div>
        </section>

        <div class="reading" aria-label="Turn the tuner on">
          <div class="confirm" aria-hidden="true"></div>
          <div class="screen-content">
            <canvas class="bloom" aria-hidden="true"></canvas>
            <canvas class="lights" aria-hidden="true"></canvas>
            <div class="message">
              <svg class="message-icon" aria-hidden="true"></svg>
              <p class="message-title"></p>
              <p class="message-detail"></p>
            </div>
          </div>
        </div>
      </div>

      <section class="panel">
        <div class="keys">
          <div class="mic">
            <span class="label">mic</span>
            <canvas class="grille" aria-hidden="true"></canvas>
          </div>
          <span class="well">
            <button class="key key-controls" type="button" aria-pressed="false" aria-controls="dashboard">
              <span class="legend">controls</span>
            </button>
          </span>
          <span class="well well-power">
            <button class="key key-power" type="button" aria-pressed="false">
              <span class="legend"><i class="pilot"></i>power</span>
            </button>
          </span>
        </div>
      </section>
    </main>
  </body>
</html>
